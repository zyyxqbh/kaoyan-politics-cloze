<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f8">
  <title>毛中特第二章｜错题知识点互动填空</title>
  <style>
    :root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1c2530;background:#f6f7f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:18px 16px 68px}.back{display:inline-block;margin:2px 0 20px;color:#245f80;text-decoration:none}.eyebrow{color:#286988;font-size:14px;font-weight:700}h1{font-size:clamp(25px,5vw,38px);line-height:1.35;margin:6px 0 10px}.intro{color:#596774;line-height:1.75;margin:0 0 22px}.controls{display:grid;grid-template-columns:150px 1fr;gap:12px;background:#fff;border:1px solid #dce2e7;border-radius:16px;padding:14px;position:sticky;top:8px;z-index:2;box-shadow:0 7px 25px #26384b12}label{display:block;font-size:13px;color:#667480;margin:0 0 6px}select{width:100%;font:inherit;padding:10px 36px 10px 11px;border:1px solid #cad3da;border-radius:10px;background:#fff;color:#1c2530}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 2px 12px;color:#60707c;font-size:14px}.round-focus{font-weight:700;color:#286988}.card{background:#fff;border:1px solid #dce2e7;border-radius:18px;padding:clamp(20px,4vw,30px);box-shadow:0 8px 30px #26384b0c}.card-head{display:flex;justify-content:space-between;gap:12px;color:#667480;font-size:14px;margin-bottom:15px}.stem{font-size:clamp(18px,3.3vw,23px);line-height:2.05;margin:0}.blank{display:inline-block;border:0;border-bottom:2px solid #6c8796;background:#eef4f7;color:#245f80;border-radius:8px 8px 3px 3px;padding:1px 10px;margin:0 3px;min-width:112px;min-height:38px;font:inherit;line-height:1.55;vertical-align:baseline}.blank.revealed{background:#e1f2e7;border-color:#4c8761;color:#245f3a;font-weight:700}.all{display:block;margin-top:22px;border:1px solid #b8c8d1;background:#fff;color:#245f80;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700}.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.nav button{border:0;border-radius:12px;background:#245f80;color:#fff;padding:13px;font:inherit;font-weight:700}.nav button:disabled{background:#c7d0d6}.note{color:#667480;font-size:14px;line-height:1.7;margin-top:24px}@media(max-width:600px){.controls{grid-template-columns:1fr;position:static}.meta{align-items:flex-start;flex-direction:column}.blank{min-width:96px}.wrap{padding-top:12px}}
  </style>
</head>
<body><div class="wrap">
  <a class="back" href="index.html">← 返回章节选择</a>
  <div class="eyebrow">基础版 · 3轮同难度不同题</div>
  <h1>毛中特第二章｜新民主主义革命理论</h1>
  <p class="intro">每轮都复习同一批已经整理的知识点，但题干不重复。挖空数量由知识点本身决定：需要同时记住的结构会有多个空，只考一个决定性边界时只留一个空。</p>
  <section class="controls" aria-label="题目筛选">
    <div><label for="round">复测轮次</label><select id="round"><option value="0">第 1 轮</option><option value="1">第 2 轮</option><option value="2">第 3 轮</option></select></div>
    <div><label for="module">知识点</label><select id="module"><option value="0">模块 1：近代中国革命的性质（P107—P108）</option><option value="1">模块 2：革命对象与帝国主义的地位（P109）</option><option value="2">模块 3：近代中国革命的根本任务（P107—P109）</option><option value="3">模块 4：总路线及对象动力领导的对应（P108—P110）</option><option value="4">模块 5：农民问题与无产阶级领导权（P110—P111）</option><option value="5">模块 6：新民主主义共和国的国体政体（P112）</option><option value="6">模块 7：民族的科学的大众的文化（P113）</option><option value="7">模块 8：农村包围城市道路的必然性（P114）</option><option value="8">模块 9：农村根据地存在发展的条件（P114）</option><option value="9">模块 10：工农武装割据三者关系（P114）</option><option value="10">模块 11：革命道路和三大法宝的著作对应（P114—P115）</option><option value="11">模块 12：党的建设的主要经验与优良作风（P117）</option><option value="12">模块 13：旧民主主义向新民主主义的转变（P107—P108）</option><option value="13">模块 14：两步革命的界限与联系（P118）</option><option value="14">模块 15：土地革命的主要内容与直接任务（P112）</option><option value="15">模块 16：新民主主义革命理论的实践来源（P107—P108）</option><option value="16">模块 17：官僚资本主义成为革命对象（P109）</option><option value="17">模块 18：实现无产阶级领导权的条件（P110—P111）</option><option value="18">模块 19：保护民族工商业（P112）</option><option value="19">模块 20：阶级结构与中国无产阶级特点（P111、P115）</option><option value="20">模块 21：各时期的主要革命对象（P109）</option><option value="21">模块 22：统一战线的必要性与两个联盟（P115）</option><option value="22">模块 23：革命动力及其地位（P110—P111）</option><option value="23">模块 24：革命性质与社会主义前途（P107—P108、P112）</option></select></div>
  </section>
  <div class="meta"><span id="counter"></span><span class="round-focus" id="focus"></span></div>
  <main id="question"></main>
  <div class="nav"><button id="prev" type="button">上一个知识点</button><button id="next" type="button">下一个知识点</button></div>
  <p class="note">本文件可离线使用；关闭后不会保存揭晓状态。各轮题目均属于基础记忆训练，轮次不代表难度递增。</p>
</div>
<script src="basic-cloze-data.js"></script>
<script>
const chapter=BASIC_CLOZE.mztChapter2;
const round=document.getElementById('round');
const moduleSelect=document.getElementById('module');
const question=document.getElementById('question');
const roundNames=["核心表述","关系对应","边界辨析"];
function parse(source){const parts=[];let cursor=0;const pattern=/\{\{([^{}]+)\}\}/g;let match;while((match=pattern.exec(source))!==null){parts.push(document.createTextNode(source.slice(cursor,match.index)));const button=document.createElement('button');button.type='button';button.className='blank';button.dataset.answer=match[1];button.textContent='点这里看答案';button.setAttribute('aria-label','点击显示答案');button.setAttribute('aria-pressed','false');parts.push(button);cursor=pattern.lastIndex}parts.push(document.createTextNode(source.slice(cursor)));return parts}
function update(){const r=Number(round.value),m=Number(moduleSelect.value),source=chapter.modules[m].rounds[r];const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';head.innerHTML='<span>第 '+(r+1)+' 轮</span><span>'+roundNames[r]+'</span>';const stem=document.createElement('p');stem.className='stem';for(const part of parse(source))stem.appendChild(part);const all=document.createElement('button');all.type='button';all.className='all';all.textContent='显示本题全部答案';card.append(head,stem,all);question.replaceChildren(card);document.getElementById('counter').textContent='第 '+(m+1)+' / '+chapter.modules.length+' 个知识点';document.getElementById('focus').textContent='本轮侧重：'+roundNames[r];document.getElementById('prev').disabled=m<=0;document.getElementById('next').disabled=m>=chapter.modules.length-1}
round.addEventListener('change',update);moduleSelect.addEventListener('change',update);document.getElementById('prev').addEventListener('click',()=>{moduleSelect.value=Number(moduleSelect.value)-1;update();scrollTo({top:0,behavior:'smooth'})});document.getElementById('next').addEventListener('click',()=>{moduleSelect.value=Number(moduleSelect.value)+1;update();scrollTo({top:0,behavior:'smooth'})});question.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.classList.contains('blank')){const shown=button.classList.toggle('revealed');button.textContent=shown?button.dataset.answer:'点这里看答案';button.setAttribute('aria-pressed',String(shown))}else if(button.classList.contains('all')){const blanks=[...question.querySelectorAll('.blank')];const show=blanks.some(item=>!item.classList.contains('revealed'));for(const item of blanks){item.classList.toggle('revealed',show);item.textContent=show?item.dataset.answer:'点这里看答案';item.setAttribute('aria-pressed',String(show))}button.textContent=show?'收起本题答案':'显示本题全部答案'}});update();
</script></body></html>
