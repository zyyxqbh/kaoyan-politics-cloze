<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315744">
  <link rel="manifest" href="manifest.webmanifest">
  <title>肖八章节填空</title>
  <style>
    :root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1f2c27;background:#f3f5f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:880px;margin:auto;padding:18px 16px 72px}.back{display:inline-block;margin:4px 0 18px;color:#37664f;text-decoration:none}.eyebrow{font-size:13px;color:#47715b;font-weight:700}h1{font-size:clamp(25px,5vw,38px);line-height:1.35;margin:6px 0 8px}.sub{margin:0 0 20px;color:#68756d;line-height:1.7}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#dfe7e1;border-radius:15px;padding:6px;margin-bottom:14px}.mode{border:0;border-radius:10px;padding:11px 6px;background:transparent;color:#65726a;font:inherit;font-weight:700}.mode.active{background:#fff;color:#315f48;box-shadow:0 3px 12px #29433312}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;position:sticky;top:8px;z-index:3;background:#fff;border:1px solid #d5ded7;border-radius:15px;padding:12px;box-shadow:0 7px 25px #29433310}.controls select{min-width:0;width:100%;border:1px solid #cbd6ce;border-radius:10px;background:#fff;padding:10px;font:inherit}.shuffle{border:0;border-radius:10px;padding:10px 14px;background:#e4eee7;color:#315f48;font:inherit;font-weight:700}.meta{display:flex;justify-content:space-between;gap:12px;margin:18px 2px 10px;color:#68756d;font-size:14px}.card{background:#fff;border:1px solid #d7dfd9;border-radius:19px;padding:clamp(20px,4vw,31px);box-shadow:0 9px 30px #2943330c}.card-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px;color:#6c7870;font-size:13px}.stem{font-size:clamp(18px,3.3vw,22px);line-height:2.05;margin:0}.blank{display:inline-block;min-width:108px;min-height:38px;margin:1px 3px;padding:2px 10px;border:0;border-bottom:2px solid #789488;border-radius:8px 8px 3px 3px;background:#edf4ef;color:#315f48;font:inherit;line-height:1.55;vertical-align:baseline}.blank.revealed{background:#e1f0e5;border-color:#4d8760;color:#245f3a;font-weight:700}.detail{display:none;margin:20px 0 0;padding-top:16px;border-top:1px dashed #d0d9d2;color:#5f6d65;font-size:14px;line-height:1.75}.detail.visible{display:block}.detail strong{color:#315f48}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.actions button{border:1px solid #bdccc2;border-radius:10px;background:#fff;color:#37664f;padding:10px 13px;font:inherit;font-weight:700}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.nav button{border:0;border-radius:11px;background:#37664f;color:#fff;padding:13px;font:inherit;font-weight:700}.nav button:disabled{background:#c8d0ca}.hint{color:#6c7870;font-size:13px;line-height:1.7;margin:18px 2px 0}@media(max-width:600px){.controls{position:static}.modes{grid-template-columns:repeat(2,1fr)}.mode{text-align:center}.meta{display:block}.meta span{display:block;margin-bottom:4px}.blank{min-width:92px}}
  </style>
</head>
<body>
<main class="wrap">
  <a class="back" href="xiao8.html">← 返回肖八章节选择</a>
  <div class="eyebrow" id="book"></div><h1 id="title">正在载入…</h1><p class="sub" id="description"></p>
  <nav class="modes" aria-label="训练范围"><button class="mode active" data-mode="all">全部训练</button><button class="mode" data-mode="core">核心表述</button><button class="mode" data-mode="relation">关系对应</button><button class="mode" data-mode="boundary">边界辨析</button></nav>
  <section class="controls"><select id="questionSelect" aria-label="选择题目"></select><button class="shuffle" id="shuffle" type="button">随机一题</button></section>
  <div class="meta"><span id="counter"></span><span id="focus"></span></div><section id="question"></section>
  <div class="nav"><button id="prev" type="button">上一题</button><button id="next" type="button">下一题</button></div>
  <p class="hint">先把答案放回句子中完整朗读，再检查关键限定词、关系名称和关系两端。来源题号只用于覆盖核对，不是背诵内容。</p>
  <p class="hint" id="offline-status">正在准备离线内容…</p>
</main>
<script src="xiao8-data.js"></script>
<script>
const params=new URLSearchParams(location.search),chapter=XIAO8_CLOZE.chapters.find(item=>item.id===params.get('chapter'))||XIAO8_CLOZE.chapters[0],book=XIAO8_CLOZE.books.find(item=>item.id===chapter.book);let mode='all',index=0;const select=document.getElementById('questionSelect'),holder=document.getElementById('question');document.getElementById('book').textContent=book.title;document.getElementById('title').textContent=chapter.title;const descriptions={all:'按最小知识模块练习本章全部题目。',core:'回忆定义、构成、地位、作用和方法要求中的决定性信息。',relation:'练习概念与条件、层级、作用、对象之间的对应。',boundary:'用完整的正面表述区分容易混淆的知识边界。'};const labels={core:'核心表述',relation:'关系对应',boundary:'边界辨析'};
function items(){const result=[];for(const module of chapter.modules){for(const kind of ['core','relation','boundary']){if(mode!=='all'&&mode!==kind)continue;for(const item of module[kind])result.push({...item,kind,moduleTitle:module.title})}}return result}function parse(source){const fragment=document.createDocumentFragment();let cursor=0;const pattern=/\{\{([^{}]+)\}\}/g;let match;while((match=pattern.exec(source))!==null){fragment.append(document.createTextNode(source.slice(cursor,match.index)));const button=document.createElement('button');button.type='button';button.className='blank';button.dataset.answer=match[1];button.textContent='点这里看答案';button.setAttribute('aria-pressed','false');fragment.append(button);cursor=pattern.lastIndex}fragment.append(document.createTextNode(source.slice(cursor)));return fragment}
function sync(){select.replaceChildren();items().forEach((item,i)=>{const option=document.createElement('option');option.value=i;option.textContent=(i+1)+'｜'+item.moduleTitle+' · '+labels[item.kind];select.append(option)});index=Math.min(index,Math.max(0,items().length-1));select.value=index}
function render(){const list=items();document.getElementById('description').textContent=descriptions[mode];if(!list.length){holder.innerHTML='<article class="card">本章暂无有独立依据的这一类题，未为凑轮次制造重复题。</article>';document.getElementById('counter').textContent='0 题';document.getElementById('focus').textContent='';document.getElementById('prev').disabled=true;document.getElementById('next').disabled=true;return}const item=list[index];const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';const type=document.createElement('span');type.textContent=labels[item.kind];const audit=document.createElement('span');const refs=item.sourceRefs||[];audit.textContent=refs.length?'来源核对：'+refs.slice(0,3).map(ref=>'第'+ref.set+'套 Q'+ref.questionNo+ref.option).join('、')+(refs.length>3?'等'+refs.length+'处':''):'来源已建立映射';head.append(type,audit);const stem=document.createElement('p');stem.className='stem';stem.append(parse(item.question));const detail=document.createElement('div');detail.className='detail';const source=document.createElement('p');source.innerHTML='<strong>完整知识表述：</strong>';source.append(document.createTextNode(item.source));const origin=document.createElement('p');origin.innerHTML='<strong>来源范围：</strong>';origin.append(document.createTextNode(refs.map(ref=>'第'+ref.set+'套 Q'+ref.questionNo+ref.option).join('、')));detail.append(source,origin);const actions=document.createElement('div');actions.className='actions';actions.innerHTML='<button type="button" data-action="all">显示全部答案</button><button type="button" data-action="detail">展开完整表述</button>';card.append(head,stem,detail,actions);holder.replaceChildren(card);document.getElementById('counter').textContent='第 '+(index+1)+' / '+list.length+' 题';document.getElementById('focus').textContent='知识模块：'+item.moduleTitle;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===list.length-1;select.value=index}
function setMode(next){mode=next;index=0;for(const button of document.querySelectorAll('[data-mode]'))button.classList.toggle('active',button.dataset.mode===mode);sync();render()}for(const button of document.querySelectorAll('[data-mode]'))button.addEventListener('click',()=>setMode(button.dataset.mode));select.addEventListener('change',()=>{index=Number(select.value);render()});document.getElementById('shuffle').addEventListener('click',()=>{const list=items();if(list.length){index=Math.floor(Math.random()*list.length);render()}});document.getElementById('prev').addEventListener('click',()=>{if(index>0){index--;render()}});document.getElementById('next').addEventListener('click',()=>{if(index<items().length-1){index++;render()}});holder.addEventListener('click',event=>{const blank=event.target.closest('.blank');if(blank){const shown=blank.classList.toggle('revealed');blank.textContent=shown?blank.dataset.answer:'点这里看答案';blank.setAttribute('aria-pressed',String(shown));return}const action=event.target.dataset.action;if(action==='all'){const blanks=[...holder.querySelectorAll('.blank')],show=blanks.some(item=>!item.classList.contains('revealed'));for(const item of blanks){item.classList.toggle('revealed',show);item.textContent=show?item.dataset.answer:'点这里看答案'}event.target.textContent=show?'收起全部答案':'显示全部答案'}if(action==='detail'){const detail=holder.querySelector('.detail'),show=detail.classList.toggle('visible');event.target.textContent=show?'收起完整表述':'展开完整表述'}});sync();render();
</script>
<script type="module" src="offline-init.js"></script>
</body>
</html>
