<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#326548"><link rel="manifest" href="manifest.webmanifest"><title>肖八知识点复习</title><style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#243b30;background:#f4f6f2}*{box-sizing:border-box}body{margin:0}.wrap{width:100%;max-width:950px;margin:auto;padding:24px 18px 70px}a{color:#326548;text-decoration:none}h1{font-size:30px;line-height:1.4;margin:16px 0 10px}h2{font-size:23px}p{line-height:1.8}.muted{color:#67746c;font-size:14px}.tag{color:#326548;font-size:13px;font-weight:bold}.stats,.tabs,.row{display:flex;gap:10px;flex-wrap:wrap}.stats{margin:22px 0}.stats>span{background:#fff;border:1px solid #d5dfd6;border-radius:12px;padding:14px 18px}.stats strong{font-size:23px;display:block}.tabs{padding:8px;background:#e2e9e0;border-radius:14px}.tabs button{flex:1;min-width:75px;background:transparent}.tabs button.active{background:#fff;color:#2a6241}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:20px 0}.chapter,.card{background:#fff;border:1px solid #d5dfd6;border-radius:16px;padding:24px}.chapter h3{font-size:19px;line-height:1.5;margin:8px 0}.chapter p{margin:0;color:#64746a;font-size:14px}button,select{font:inherit}button{cursor:pointer;border:1px solid #c9d6ca;border-radius:9px;background:#fff;color:#326548;padding:10px 14px}button:disabled{opacity:.4;cursor:default}select{width:100%;min-width:0;border:1px solid #c9d6ca;border-radius:9px;background:#fff;padding:11px;color:#243b30}.selectors{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:20px 0 10px}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:#65756a;margin:18px 0 12px}.stem{font-size:21px;line-height:2.1;margin:0;overflow-wrap:anywhere}.blank{display:inline;min-width:65px;white-space:normal;box-decoration-break:clone;-webkit-box-decoration-break:clone;border:0;border-bottom:2px solid #8ca48f;border-radius:4px;padding:4px 10px;background:#edf3ed;color:#477454;font:inherit;line-height:1.8}.blank.revealed{background:#dceee1;color:#235735;font-weight:bold}.row{margin-top:22px}.row button.primary{background:#326548;color:#fff}.nav{display:flex;justify-content:space-between;margin:14px 0}.scope{color:#5f7164;font-size:14px;border-left:3px solid #9bb79f;padding-left:13px;margin:18px 0;line-height:1.8}details{margin-top:24px;border-top:1px solid #d8e1d8;padding-top:16px}summary{cursor:pointer;color:#326548;font-weight:bold}details li{line-height:1.9;margin:10px 0}.source{font-size:13px;line-height:1.8;color:#68756b}.empty{padding:35px;text-align:center}.unit-title{font-size:22px;line-height:1.5;margin:8px 0 14px}.status{font-size:12px;color:#69776c;margin-top:26px}@media(max-width:650px){.wrap{padding:19px 14px 50px}.grid,.selectors{grid-template-columns:minmax(0,1fr)}.card{padding:21px 17px}.stem{font-size:19px}h1{font-size:27px}.tabs button{font-size:14px;padding:10px 5px}.stats>span{flex:1;min-width:100px;padding:12px}.row button{font-size:14px}.unit-title{font-size:20px}}
</style></head><body><main class="wrap"><a href="xiao8.html">← 返回章节选择</a><div id="book" class="tag" style="margin-top:24px"></div><h1 id="chapter"></h1><div class="selectors"><select id="unit" aria-label="选择知识单元"></select><select id="question" aria-label="选择单元内题目"></select></div><div class="meta"><span id="progress"></span><span id="kind"></span></div><article class="card"><h2 class="unit-title" id="unit-title"></h2><p class="stem" id="stem"></p><div class="row"><button id="reveal" class="primary">显示全部答案</button><button id="random">随机一题</button></div><details id="whole"><summary>查看整个知识点</summary><p class="scope" id="scope"></p><ol id="full-unit"></ol><p class="source" id="sources"></p><p class="source" id="originals"></p></details></article><div class="nav"><button id="prev">← 上一题</button><button id="next">下一题 →</button></div><p class="muted">先独立回忆，再点空格核对。一个单元练完后，可展开整个知识点连贯复述。</p><p class="status" id="offline-status">正在准备离线内容…</p></main><script src="xiao8-data.js"></script><script>
const d=XIAO8_CLOZE,$=id=>document.getElementById(id),p=new URLSearchParams(location.search);let c=d.chapters.find(c=>c.id===p.get('chapter'))||d.chapters[0];const kinds={core:'核心表述',relation:'关系对应',boundary:'边界辨析'};const list=[];for(const [ui,u] of c.modules.entries())for(const k of Object.keys(kinds))for(const q of u[k])list.push({ui,u,k,q});let i=0;const key='xiao8:'+d.version+':'+c.id;try{const saved=localStorage.getItem(key);i=Math.max(0,list.findIndex(x=>x.q.id===saved))}catch{}const requested=p.get('unit');if(requested){const n=list.findIndex(x=>x.u.id===requested);if(n>=0)i=n}$('chapter').textContent=c.title;$('book').textContent=d.books.find(b=>b.id===c.book).title;
for(const [n,u] of c.modules.entries()){const o=document.createElement('option');o.value=n;o.textContent=(n+1)+'｜'+u.title;$('unit').append(o)}
function syncQuestions(){const x=list[i];$('question').replaceChildren();for(const [n,y] of list.entries()){if(y.ui!==x.ui)continue;const o=document.createElement('option');o.value=n;const same=list.filter(z=>z.ui===x.ui);o.textContent=(same.findIndex(z=>z.q.id===y.q.id)+1)+'｜'+y.q.question.replace(/\{\{[^{}]+\}\}/g,'（　）').slice(0,52);$('question').append(o)}$('question').value=i;$('unit').value=x.ui}
function render(){const x=list[i];syncQuestions();$('unit-title').textContent=x.u.title;$('kind').textContent=kinds[x.k]+' · '+(x.q.materialRefs.every(r=>r.kind==='core')?'核心考案':'肖八补充');const same=list.filter(y=>y.ui===x.ui);$('progress').textContent='单元 '+(x.ui+1)+' / '+c.modules.length+' · 单元内 '+(same.findIndex(y=>y.q.id===x.q.id)+1)+' / '+same.length+' 题';$('stem').replaceChildren();let cursor=0,m;const re=/\{\{([^{}]+)\}\}/g;while((m=re.exec(x.q.question))){$('stem').append(document.createTextNode(x.q.question.slice(cursor,m.index)));const b=document.createElement('button');b.type='button';b.className='blank';b.textContent='____';b.dataset.answer=m[1];b.setAttribute('aria-label','显示此空答案');b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>toggle(b,!b.classList.contains('revealed')));$('stem').append(b);cursor=re.lastIndex}$('stem').append(document.createTextNode(x.q.question.slice(cursor)));$('reveal').textContent='显示全部答案';$('whole').open=false;$('scope').textContent='本单元范围：'+x.u.scope;$('full-unit').replaceChildren();for(const k of Object.keys(kinds))for(const q of x.u[k]){const li=document.createElement('li');li.append(document.createTextNode(q.materialRefs.every(r=>r.kind==='core')?'':'【补充】'));let pos=0,m;const re=/\{\{([^{}]+)\}\}/g;while((m=re.exec(q.question))){li.append(document.createTextNode(q.question.slice(pos,m.index)));const strong=document.createElement('strong');strong.textContent=m[1];li.append(strong);pos=re.lastIndex}li.append(document.createTextNode(q.question.slice(pos)));$('full-unit').append(li)}$('sources').textContent=x.u.materialRefs.map(r=>r.title+' · PDF第'+r.pdfPages.join('、')+'页').join('；');$('originals').textContent='肖八定位：'+x.u.sourceQuestionIds.map(s=>s.replace('xiao8-','第').replace('-','套第')+'题').join('、');$('prev').disabled=i===0;$('next').disabled=i===list.length-1;try{localStorage.setItem(key,x.q.id)}catch{}history.replaceState(null,'','?chapter='+encodeURIComponent(c.id)+'&unit='+encodeURIComponent(x.u.id))}
function toggle(b,on){b.classList.toggle('revealed',on);b.textContent=on?b.dataset.answer:'____';b.setAttribute('aria-pressed',String(on))}
$('reveal').addEventListener('click',()=>{const bs=[...$('stem').querySelectorAll('.blank')],on=bs.some(b=>!b.classList.contains('revealed'));bs.forEach(b=>toggle(b,on));$('reveal').textContent=on?'收起全部答案':'显示全部答案'});$('unit').addEventListener('change',()=>{i=list.findIndex(x=>x.ui===Number($('unit').value));render()});$('question').addEventListener('change',()=>{i=Number($('question').value);render()});$('prev').addEventListener('click',()=>{if(i>0){i--;render()}});$('next').addEventListener('click',()=>{if(i<list.length-1){i++;render()}});$('random').addEventListener('click',()=>{i=Math.floor(Math.random()*list.length);render()});render();
</script><script type="module" src="offline-init.js"></script></body></html>
