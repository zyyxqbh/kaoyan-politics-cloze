<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><title>重点知识互动填空</title>
<style>:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#172433;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;margin:auto;padding:18px 16px 72px}.back{display:inline-block;margin:4px 0 18px;color:#245f80;text-decoration:none}.eyebrow{font-size:13px;color:#356b86;font-weight:700}h1{font-size:clamp(25px,5vw,38px);line-height:1.35;margin:6px 0 8px}.sub{margin:0 0 20px;color:#63717d;line-height:1.7}.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#e2e7ea;border-radius:15px;padding:6px;margin:0 0 14px}.mode{border:0;border-radius:10px;padding:11px 6px;background:transparent;color:#5c6974;font:inherit;font-weight:700}.mode.active{background:#fff;color:#174f70;box-shadow:0 3px 12px #17324d12}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;position:sticky;top:8px;z-index:3;background:#fff;border:1px solid #d7dfe4;border-radius:15px;padding:12px;box-shadow:0 7px 25px #17324d10}.controls select{width:100%;min-width:0;border:1px solid #cbd5dc;border-radius:10px;background:#fff;padding:10px;font:inherit;color:#172433}.shuffle{border:0;border-radius:10px;padding:10px 14px;background:#e8f0f4;color:#245f80;font:inherit;font-weight:700}.meta{display:flex;justify-content:space-between;gap:12px;margin:18px 2px 10px;color:#657480;font-size:14px}.card{background:#fff;border:1px solid #d8e0e5;border-radius:19px;padding:clamp(20px,4vw,31px);box-shadow:0 9px 30px #17324d0c}.card-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px;color:#687681;font-size:13px}.stem{font-size:clamp(18px,3.3vw,22px);line-height:2.05;margin:0}.blank{display:inline-block;min-width:108px;min-height:38px;margin:1px 3px;padding:2px 10px;border:0;border-bottom:2px solid #7891a1;border-radius:8px 8px 3px 3px;background:#edf3f6;color:#235d7d;font:inherit;line-height:1.55;vertical-align:baseline}.blank.revealed{background:#e2f1e6;border-color:#4d8760;color:#245f3a;font-weight:700}.source{display:none;margin:20px 0 0;padding-top:16px;border-top:1px dashed #d0d9df;color:#64727d;font-size:14px;line-height:1.75}.source.visible{display:block}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.actions button{border:1px solid #bdccd5;border-radius:10px;background:#fff;color:#245f80;padding:10px 13px;font:inherit;font-weight:700}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.nav button{border:0;border-radius:11px;background:#245f80;color:#fff;padding:13px;font:inherit;font-weight:700}.nav button:disabled{background:#c8d0d5}.hint{color:#6c7881;font-size:13px;line-height:1.7;margin:18px 2px 0}@media(max-width:600px){.controls{position:static}.mode-tabs{grid-template-columns:1fr}.mode{text-align:left}.meta{display:block}.meta span{display:block;margin-bottom:4px}.blank{min-width:92px}}</style></head>
<body><main class="wrap"><a class="back" href="index.html">← 返回章节选择</a><div class="eyebrow" id="book"></div><h1 id="title">正在载入…</h1><p class="sub" id="description"></p><nav class="mode-tabs" aria-label="训练方式"><button class="mode active" data-mode="core">核心回忆</button><button class="mode" data-mode="reverse">反向定位</button><button class="mode" data-mode="compare">易混关系组</button></nav><section class="controls"><select id="questionSelect" aria-label="选择题目"></select><button class="shuffle" id="shuffle" type="button">随机一题</button></section><div class="meta"><span id="counter"></span><span id="focus"></span></div><section id="question"></section><div class="nav"><button id="prev" type="button">上一题</button><button id="next" type="button">下一题</button></div><p class="hint">先独立回忆，再点空白看答案。只有不确定口径时才展开完整原句，避免把“眼熟”误当成“会背”。</p></main>
<script src="focus-data.js"></script><script>
const params=new URLSearchParams(location.search),chapter=FOCUS_CLOZE.chapters.find(item=>item.id===params.get('chapter'))||FOCUS_CLOZE.chapters[0],book=FOCUS_CLOZE.books.find(item=>item.id===chapter.book);let mode='core',index=0;const select=document.getElementById('questionSelect'),holder=document.getElementById('question');document.getElementById('book').textContent=book.title;document.getElementById('title').textContent=chapter.title;const descriptions={core:'逐条提取决定性信息，保持重点材料的规范口径。',reverse:'从结论反查概念，打破只会顺着原句识别的惯性。',compare:'把同章相似定位集中呈现，专门处理关系串位。'};function items(){return chapter[mode]}function parse(source){const fragment=document.createDocumentFragment();let cursor=0;const pattern=/\{\{([^{}]+)\}\}/g;let match;while((match=pattern.exec(source))!==null){fragment.append(document.createTextNode(source.slice(cursor,match.index)));const button=document.createElement('button');button.type='button';button.className='blank';button.dataset.answer=match[1];button.textContent='点这里看答案';button.setAttribute('aria-pressed','false');fragment.append(button);cursor=pattern.lastIndex}fragment.append(document.createTextNode(source.slice(cursor)));return fragment}function syncSelect(){select.innerHTML='';items().forEach((item,i)=>{const option=document.createElement('option');option.value=i;option.textContent=(i+1)+'｜'+item.title;select.append(option)});index=Math.min(index,Math.max(0,items().length-1));select.value=index}function render(){const list=items();document.getElementById('description').textContent=descriptions[mode];if(!list.length){holder.innerHTML='<article class="card">本章暂无这一类题。</article>';return}const item=list[index];const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';head.innerHTML='<span>'+({core:'核心回忆',reverse:'反向定位',compare:'易混关系组'})[mode]+'</span><span>'+(item.sourceNo?'原表第 '+item.sourceNo+' 条':'关系组')+'</span>';const stem=document.createElement('p');stem.className='stem';stem.append(parse(item.question));const source=document.createElement('p');source.className='source';source.textContent='完整原句：'+item.source;const actions=document.createElement('div');actions.className='actions';actions.innerHTML='<button type="button" data-action="all">显示全部答案</button><button type="button" data-action="source">展开完整原句</button>';card.append(head,stem,source,actions);holder.replaceChildren(card);document.getElementById('counter').textContent='第 '+(index+1)+' / '+list.length+' 题';document.getElementById('focus').textContent=item.title;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===list.length-1;select.value=index}function changeMode(next){mode=next;index=0;for(const button of document.querySelectorAll('[data-mode]'))button.classList.toggle('active',button.dataset.mode===mode);syncSelect();render()}for(const button of document.querySelectorAll('[data-mode]'))button.addEventListener('click',()=>changeMode(button.dataset.mode));select.addEventListener('change',()=>{index=Number(select.value);render()});document.getElementById('shuffle').addEventListener('click',()=>{index=Math.floor(Math.random()*items().length);select.value=index;render()});document.getElementById('prev').addEventListener('click',()=>{if(index>0){index--;render()}});document.getElementById('next').addEventListener('click',()=>{if(index<items().length-1){index++;render()}});holder.addEventListener('click',event=>{const blank=event.target.closest('.blank');if(blank){const shown=blank.classList.toggle('revealed');blank.textContent=shown?blank.dataset.answer:'点这里看答案';blank.setAttribute('aria-pressed',String(shown));return}const action=event.target.dataset.action;if(action==='all'){const blanks=[...holder.querySelectorAll('.blank')],show=blanks.some(item=>!item.classList.contains('revealed'));for(const item of blanks){item.classList.toggle('revealed',show);item.textContent=show?item.dataset.answer:'点这里看答案'}event.target.textContent=show?'收起全部答案':'显示全部答案'}if(action==='source'){const source=holder.querySelector('.source'),show=source.classList.toggle('visible');event.target.textContent=show?'收起完整原句':'展开完整原句'}});syncSelect();render();
</script></body></html>
