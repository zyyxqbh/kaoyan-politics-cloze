<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315744">
  <link rel="manifest" href="manifest.webmanifest">
  <title>肖八全选项知识填空</title>
  <style>
    :root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1f2c27;background:#f3f5f1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e4eee7 0,#f3f5f1 350px)}.wrap{max-width:1080px;margin:auto;padding:clamp(28px,6vw,68px) 18px 72px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.back{color:#37664f;text-decoration:none;font-size:14px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#d9e9de;color:#315f48;font-size:13px;font-weight:700}h1{font-size:clamp(31px,6vw,48px);line-height:1.25;margin:15px 0 12px;letter-spacing:-.03em}.lead{max-width:820px;color:#56655e;font-size:17px;line-height:1.85;margin:0 0 26px}.audit{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}.audit div{background:#fff9;border:1px solid #d4dfd7;border-radius:14px;padding:15px}.audit strong{display:block;color:#315f48;font-size:21px}.audit span{font-size:12px;color:#6b786f}.book-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:6px;background:#dfe7e1;border-radius:16px;margin-bottom:27px}.book-tab{border:0;border-radius:11px;padding:11px 6px;background:transparent;color:#617068;font:inherit;font-weight:700;cursor:pointer}.book-tab small{display:block;margin-top:3px;font-size:11px;font-weight:500}.book-tab.active{background:#fff;color:#315f48;box-shadow:0 4px 14px #25463414}.book-head p{margin:0 0 4px;color:#47715b;font-size:13px;font-weight:700}.book-head h2{margin:0 0 18px;font-size:clamp(21px,4vw,29px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{display:block;padding:21px;background:#fff;border:1px solid #d7dfd9;border-radius:17px;color:inherit;text-decoration:none;box-shadow:0 8px 26px #2943330b}.card:active{transform:scale(.99)}.card h3{font-size:19px;line-height:1.45;margin:8px 0}.card p{color:#68756d;margin:0 0 15px;font-size:13px}.count,.go{color:#37664f;font-size:13px;font-weight:700}.footer{margin-top:30px;padding-top:20px;border-top:1px solid #d5ddd7;color:#6a776f;font-size:13px;line-height:1.75}@media(max-width:760px){.audit{grid-template-columns:repeat(2,1fr)}.book-tabs{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="topline"><span class="tag">2027 肖八 · 全选项覆盖</span><a class="back" href="index.html">返回重点题库</a></div>
  <h1>肖八全选项知识填空</h1>
  <p class="lead">不是按第一套到第八套重做选择题。每道选择题的 A、B、C、D 都进入覆盖审计，再按知识所属章节重新排列：入选项练规范结论，未入选项练决定性边界。</p>
  <section class="audit" aria-label="覆盖审计">
    <div><strong id="questionCount">—</strong><span>道选择题</span></div>
    <div><strong id="optionCount">—</strong><span>个选项覆盖位</span></div>
    <div><strong id="selectedCount">—</strong><span>个入选项</span></div>
    <div><strong id="distractorCount">—</strong><span>个未入选项</span></div>
  </section>
  <nav class="book-tabs" id="bookTabs" aria-label="选择科目"></nav>
  <section class="book-head"><p>当前科目</p><h2 id="bookTitle">正在载入…</h2></section>
  <section class="grid" id="chapterGrid"></section>
  <footer class="footer">题目按章节与知识关系排列，套卷题号只保留在“来源核对”中，不参与复习顺序。选项本身正确但不回答设问时，统一标为“不符合题意”，不误判为知识错误。</footer>
  <p class="footer" id="offline-status">正在准备离线内容…</p>
</main>
<script src="xiao8-data.js"></script>
<script>
const data=XIAO8_CLOZE,tabs=document.getElementById('bookTabs'),grid=document.getElementById('chapterGrid'),title=document.getElementById('bookTitle');
document.getElementById('questionCount').textContent=data.audit.questions;
document.getElementById('optionCount').textContent=data.audit.optionSlots;
document.getElementById('selectedCount').textContent=data.audit.selectedOptions;
document.getElementById('distractorCount').textContent=data.audit.distractorOptions;
for(const book of data.books){if(!book.chapterIds.length)continue;const button=document.createElement('button');button.className='book-tab';button.type='button';button.dataset.book=book.id;button.innerHTML='<span></span><small></small>';button.querySelector('span').textContent=book.shortTitle;button.querySelector('small').textContent=book.chapterIds.length+' 章';tabs.append(button)}
function show(bookId){const book=data.books.find(item=>item.id===bookId)||data.books.find(item=>item.chapterIds.length);title.textContent=book.title;grid.replaceChildren();for(const chapterId of book.chapterIds){const chapter=data.chapters.find(item=>item.id===chapterId);if(!chapter)continue;const card=document.createElement('a');card.className='card';card.href='xiao8-study.html?chapter='+encodeURIComponent(chapter.id);const count=document.createElement('span');count.className='count';count.textContent=chapter.all.length+' 题';const heading=document.createElement('h3');heading.textContent=chapter.title;const detail=document.createElement('p');detail.textContent=chapter.correct.length+' 入选项 · '+chapter.wrong.length+' 未入选项';const go=document.createElement('span');go.className='go';go.textContent='开始复习 →';card.append(count,heading,detail,go);grid.append(card)}for(const button of tabs.children)button.classList.toggle('active',button.dataset.book===book.id);history.replaceState(null,'','#'+book.id)}
tabs.addEventListener('click',event=>{const button=event.target.closest('[data-book]');if(button)show(button.dataset.book)});const requested=location.hash.slice(1);show(data.books.some(book=>book.id===requested&&book.chapterIds.length)?requested:data.books.find(book=>book.chapterIds.length).id);
</script>
<script type="module" src="offline-init.js"></script>
</body>
</html>
